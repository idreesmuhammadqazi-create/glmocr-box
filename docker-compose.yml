services:
  glm-ocr:
    build: .
    image: glmocr-box:latest
    container_name: glmocr-box
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OCR_API_KEY: ${OCR_API_KEY:-changeme-please}
      EMBED_IMAGES: ${EMBED_IMAGES:-true}
      PDF_DPI: ${PDF_DPI:-200}
      MODEL_QUANT: ${MODEL_QUANT:-Q8_0}
      CONTEXT: ${CONTEXT:-8192}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      THREADS: ${THREADS:-4}
      PORT: 8000
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    volumes:
      - ./models:/models
      - glmocr-cache:/cache
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  glmocr-cache:
